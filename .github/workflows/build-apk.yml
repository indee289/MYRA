# MYRA — automatic APK build + GitHub Release
#
# Har push on main (aur manual Run workflow) par:
#   1. Debug APK build hota hai (Gradle 8.7, JDK 17, Android SDK 34)
#   2. APK ko GitHub Release me upload kar diya jata hai (tag: build-<run number>)
#
# Notes:
# - Repo me gradle-wrapper.jar nahi hai, isliye `./gradlew` ki jagah
#   `gradle/actions/setup-gradle` se Gradle 8.7 install karke `gradle` chalaya jata hai.
# - GitHub runner par Android SDK pehle se installed hota hai, isliye
#   `android-actions/setup-android` use NAHI kiya — v3 purana 'tools' package
#   install karne ki koshish karta hai jo ab exist hi nahi karta, aur
#   "Failed to find package 'tools'" error se fail ho jata hai (run #1).
#   Isi liye sdkmanager ko PATH se nahi, $ANDROID_HOME/cmdline-tools ke
#   andar dhoondh kar chalaya jata hai (run #2 me `sdkmanager: command
#   not found` aaya tha kyunki PATH me nahi tha). Note: sdkmanager
#   cmdline-tools/<version>/bin/ me hota hai, isliye find me maxdepth 3
#   chahiye — maxdepth 2 se kuch nahi milta aur $SDKMANAGER khaali reh
#   jata hai (run #3 me yahi hua).
# - Placeholder icon banate time parent folder bhi banana zaruri hai:
#   repo me `res/mipmap/` folder hi nahi hai (img.png binary hone se
#   upload nahi hui thi), isliye open() se pehle makedirs lagaya gaya
#   hai (run #4 me FileNotFoundError aaya tha).
# - Launcher icons (mipmap/img.png, drawable/img_foreground.png) abhi repo me
#   nahi hain — AndroidManifest unhe @mipmap/img se use karta hai, isliye
#   build se pehle agar wo missing hon to ek temporary laal placeholder icon
#   bana diya jata hai. Asli icons GitHub website se upload karte hi
#   placeholder ki jagah wahi use honge.
# - APK ko release keystore (alias myra-release) se sign kiya jata hai:
#   keystore file repo root me hai (myra-release.keystore — private repo,
#   kabhi public mat karna), password secrets KEYSTORE_PASSWORD / KEY_ALIAS
#   me hai. Keystore ~/workspace/myra-extract/release-key/ me backup hai
#   (25 saal valid, SHA-256 fingerprint 37:79:B3:A2:15:06:61:E0:F2:2B:9F:
#   A2:19:87:24:38:64:58:7B:D3:8E:75:CD:D4:43:1B:C0:D4:61:FD:59:A9).
#   NOTE: PKCS12 keystore hai, isliye key password = store password.
#   NOTE: pehle ANDROID_KEYSTORE base64 secret try kiya tha, par browser
#   se paste karte time 36 characters choot gaye the (3620/3656) — isliye
#   ab keystore file seedha repo me hai, base64 secret use NAHI hota.
#   Release-signed APK purane debug-signed APK ke upar install NAHI hoga
#   (signature alag hai) — pehle purana uninstall karna padega.

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android platform 34 + build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; ls "$ANDROID_HOME/cmdline-tools"; exit 1; fi
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Placeholder launcher icons (agar missing hon)
        run: |
          python3 - <<'PY'
          import os, struct, zlib

          def write_png(path, w, h, rgb):
              def chunk(ctype, data):
                  c = struct.pack('>I', len(data)) + ctype + data
                  return c + struct.pack('>I', zlib.crc32(ctype + data) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              row = b'\x00' + bytes(rgb) * w
              idat = zlib.compress(row * h)
              with open(path, 'wb') as f:
                  f.write(sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b''))

          for p in ['app/src/main/res/mipmap/img.png',
                    'app/src/main/res/drawable/img_foreground.png']:
              if not os.path.exists(p):
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  write_png(p, 512, 512, (255, 23, 68))  # MYRA red placeholder
                  print('created placeholder:', p)
              else:
                  print('exists, kept as-is:', p)
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Sign APK with release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f myra-release.keystore ]; then echo "myra-release.keystore missing from repo root"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then echo "KEYSTORE_PASSWORD / KEY_ALIAS secret missing"; exit 1; fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; fi
          # Purani debug signature hatakar release key se sign karo
          zip -d app/build/outputs/apk/debug/app-debug.apk 'META-INF/*' || true
          "$APKSIGNER" sign --ks myra-release.keystore --ks-pass "env:KEYSTORE_PASSWORD" --key-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out app/build/outputs/apk/debug/app-release-signed.apk app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-release-signed.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-apk
          path: app/build/outputs/apk/debug/app-release-signed.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MYRA build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
            Release-signed APK (keystore alias myra-release) — install karne ke liye ready.
            Note: purana debug-signed APK install hai to pehle use uninstall karna hoga, kyunki signature alag hai.
          files: app/build/outputs/apk/debug/app-release-signed.apk
          fail_on_unmatched_files: true
